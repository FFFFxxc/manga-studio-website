<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perspective preview/export browser smoke</title>
    <style>
      body { background: #18181b; color: #f4f4f5; font: 14px system-ui; }
      img { width: 480px; image-rendering: pixelated; border: 1px solid #52525b; margin-right: 12px; }
    </style>
  </head>
  <body>
    <pre id="result">Running preview/export pixel comparison…</pre>
    <section id="images"></section>
    <script type="module">
      import { runPerspectivePreviewExportBrowserSmoke } from './perspectivePreviewExportBrowserSmoke.ts';

      const result = document.querySelector('#result');
      try {
        const comparison = runPerspectivePreviewExportBrowserSmoke();
        result.dataset.status = 'passed';
        result.textContent = `PASS\n${JSON.stringify({
          maxDelta: comparison.maxDelta,
          samples: comparison.samples,
          combinedCrop: comparison.combinedCrop,
        }, null, 2)}`;
        const images = document.querySelector('#images');
        for (const [label, src] of [['Preview', comparison.preview], ['Export', comparison.exported]]) {
          const figure = document.createElement('figure');
          const caption = document.createElement('figcaption');
          caption.textContent = label;
          const image = document.createElement('img');
          image.alt = label;
          image.src = src;
          figure.append(caption, image);
          images.append(figure);
        }
      } catch (error) {
        result.dataset.status = 'failed';
        result.textContent = `FAIL\n${error instanceof Error ? error.stack : String(error)}`;
        throw error;
      }
    </script>
  </body>
</html>
