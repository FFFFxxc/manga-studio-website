<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perspective WebGL browser smoke</title>
  </head>
  <body>
    <pre id="result">Running real WebGL pixel readback…</pre>
    <script type="module">
      import { runPerspectiveWebglBrowserSmoke } from './perspectiveWebglBrowserSmoke.ts';

      const result = document.querySelector('#result');
      try {
        const samples = runPerspectiveWebglBrowserSmoke();
        result.dataset.status = 'passed';
        result.textContent = `PASS\n${JSON.stringify(samples, null, 2)}`;
      } catch (error) {
        result.dataset.status = 'failed';
        result.textContent = `FAIL\n${error instanceof Error ? error.stack : String(error)}`;
        throw error;
      }
    </script>
  </body>
</html>
